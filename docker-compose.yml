services:
  devops:
    build: .
    image: devops:latest
    restart: always
    ports:
      - "8080:8080"
    environment:
      - DB_HOST=postgres
    networks:
      - devopsNet

networks:
  devopsNet:
    external: true

# Start the application
# docker compose up --build -d
# Requires PostgreSQL to be running:
# docker compose -f docker-compose-db.yml -p databases up -d